<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d527a">
<title>Survei Material PLN</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --pri:#0d527a; --pri2:#e8f1f7; --acc:#f5be14; --red:#d62828; --ok:#1f9d55; --warn:#d08a00; --bd:#d9dde2; --tx:#1b2430; --mut:#6b7380; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif; color:var(--tx); background:#f4f6f8; }
  button,input,select,textarea { font:inherit; color:inherit; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; }
  .screen.on { display:flex; }
  header { background:var(--pri); color:#fff; display:flex; align-items:center; gap:8px; padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top)); min-height:52px; }
  header h1 { font-size:17px; font-weight:600; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button { background:transparent; border:0; color:#fff; font-size:15px; padding:6px 8px; border-radius:8px; }
  header button:active { background:rgba(255,255,255,.15); }
  main { flex:1; overflow:auto; padding:12px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:12px; padding:12px; margin-bottom:10px; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .mut { color:var(--mut); font-size:13px; }
  .btn { border:1px solid var(--bd); background:#fff; border-radius:10px; padding:10px 14px; font-weight:600; font-size:14px; }
  .btn.pri { background:var(--pri); color:#fff; border-color:var(--pri); }
  .btn.red { color:var(--red); }
  .btn.sm { padding:6px 10px; font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  label.f { display:block; font-size:12.5px; color:var(--mut); margin:8px 0 3px; }
  input.i, select.i, textarea.i { width:100%; border:1px solid var(--bd); border-radius:9px; padding:9px 10px; background:#fff; font-size:15px; }
  textarea.i { min-height:60px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--bd); background:#fff; border-radius:999px; padding:7px 12px; font-size:13.5px; font-weight:600; }
  .chip.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  /* peta */
  #mapWrap { position:relative; flex:1; }
  #map { position:absolute; inset:0; width:100%; height:100%; }
  .gps { position:absolute; top:10px; left:10px; background:#fff; border-radius:999px; padding:6px 11px; font-size:13px; font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .gps .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:#999; vertical-align:0; }
  .fabs { position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:8px; }
  .fab { width:44px; height:44px; border-radius:50%; border:0; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.3); font-size:18px; font-weight:700; }
  .fab.on { background:var(--pri); color:#fff; }
  .tagbar { position:absolute; left:0; right:0; bottom:0; padding:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:flex-end; pointer-events:none; }
  .tagbar > * { pointer-events:auto; }
  #btnTag { flex:1; height:58px; border-radius:16px; border:0; background:var(--acc); color:#1b1b1b; font-size:19px; font-weight:800; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  #btnTagCenter { height:58px; border-radius:16px; border:0; background:#fff; font-size:13px; font-weight:700; padding:0 12px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .selcard { position:absolute; left:10px; right:10px; bottom:84px; background:#fff; border-radius:14px; padding:10px 12px; box-shadow:0 2px 10px rgba(0,0,0,.3); display:none; }
  .selcard.on { display:block; }
  .parentchip { position:absolute; top:52px; left:10px; background:rgba(13,82,122,.92); color:#fff; border-radius:999px; padding:5px 11px; font-size:12.5px; }
  nav.tabs { display:flex; background:#fff; border-top:1px solid var(--bd); padding-bottom:env(safe-area-inset-bottom); }
  nav.tabs button { flex:1; border:0; background:none; padding:9px 2px 8px; font-size:12px; font-weight:600; color:var(--mut); }
  nav.tabs button.on { color:var(--pri); box-shadow:inset 0 3px 0 var(--pri); }
  .tab { display:none; flex:1; flex-direction:column; min-height:0; }
  .tab.on { display:flex; }
  /* sheet */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .modal.on { display:flex; }
  .sheet { background:#fff; width:100%; max-width:640px; max-height:92%; overflow:auto; border-radius:18px 18px 0 0; padding:14px 14px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin:0 0 6px; font-size:17px; }
  .thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .thumbs .t { position:relative; }
  .thumbs img { width:84px; height:84px; object-fit:cover; border-radius:8px; border:1px solid var(--bd); display:block; }
  .thumbs .x { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; border:0; background:var(--red); color:#fff; font-size:13px; line-height:22px; padding:0; }
  table.m { width:100%; border-collapse:collapse; font-size:13.5px; background:#fff; }
  table.m td, table.m th { border-bottom:1px solid #eef0f2; padding:6px 6px; text-align:left; }
  table.m th.sec { color:#1b2430; font-size:12.5px; letter-spacing:.3px; }
  table.m input { width:78px; border:1px solid var(--bd); border-radius:7px; padding:5px 6px; text-align:right; font-size:14px; }
  table.u input { width:100%; min-width:52px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .pill.ren { background:#fde5e5; color:#9b1c1c; } .pill.eks { background:#e6eef7; color:#1f3a63; } .pill.gan { background:#fff2d6; color:#7a4b00; }
  .lockov { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30; display:none; align-items:center; justify-content:center; }
  .lockov.on { display:flex; }
  .lockbox { background:#fff; border-radius:16px; padding:18px; width:min(320px,90%); text-align:center; }
  .big { font-size:30px; font-weight:800; margin:6px 0; }
  #pv { width:100%; touch-action:none; background:#fff; border:1px solid var(--bd); border-radius:6px; display:block; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#222; color:#fff; padding:9px 14px; border-radius:10px; font-size:14px; z-index:40; display:none; max-width:90%; }
  .empty { text-align:center; color:var(--mut); padding:30px 10px; }
  .listpt { display:flex; gap:10px; align-items:center; }
  .listpt .no { width:44px; height:44px; border-radius:10px; background:var(--pri2); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--pri); flex:none; font-size:13px; }
</style>
</head>
<body>

<!-- BERANDA -->
<section class="screen on" id="scHome">
  <header><h1>Survei Material PLN</h1><button id="btnSettings">Pengaturan</button></header>
  <main>
    <div class="row" style="margin-bottom:10px">
      <button class="btn pri grow" id="btnNew">+ Survei baru</button>
      <button class="btn" id="btnImport">Impor</button>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
    </div>
    <div id="surveyList"></div>
    <p class="mut" style="text-align:center;margin-top:20px">Data tersimpan di HP ini dan bisa dipakai tanpa internet.<br>Gunakan Ekspor untuk cadangan/memindahkan data.</p>
  </main>
</section>

<!-- SURVEI -->
<section class="screen" id="scSurvey">
  <header>
    <button id="btnBack">‹ Kembali</button>
    <h1 id="svTitle">Survei</h1>
  </header>
  <div class="tab on" id="tabMap">
    <div id="mapWrap">
      <canvas id="map"></canvas>
      <div class="gps" id="gpsChip"><span class="dot"></span>GPS…</div>
      <div class="parentchip" id="parentChip"></div>
      <div class="fabs">
        <button class="fab" id="fabFollow" title="Ikuti posisi saya">◎</button>
        <button class="fab" id="fabFit" title="Tampilkan semua titik">▢</button>
        <button class="fab" id="fabLayer" title="Ganti peta">🛰</button>
      </div>
      <div class="selcard" id="selCard"></div>
      <div class="tagbar">
        <button id="btnTagCenter">+ Tengah<br>peta</button>
        <button id="btnTag">TAG TITIK</button>
      </div>
    </div>
  </div>
  <div class="tab" id="tabPoints"><main id="pointList"></main></div>
  <div class="tab" id="tabMat"><main id="matView"></main></div>
  <div class="tab" id="tabData"><main id="dataView"></main></div>
  <div class="tab" id="tabPdf"><main id="pdfView"></main></div>
  <nav class="tabs" id="tabs">
    <button data-t="tabMap" class="on">Peta</button>
    <button data-t="tabPoints">Titik</button>
    <button data-t="tabMat">Material</button>
    <button data-t="tabData">Data</button>
    <button data-t="tabPdf">PDF</button>
  </nav>
</section>

<!-- EDITOR TITIK -->
<div class="modal" id="mdPoint"><div class="sheet" id="ptSheet"></div></div>
<!-- PENGATURAN -->
<div class="modal" id="mdSettings"><div class="sheet" id="setSheet"></div></div>

<div class="lockov" id="lockOv"><div class="lockbox">
  <div class="mut">Mengunci posisi GPS…</div>
  <div class="big" id="lockAcc">±– m</div>
  <div class="mut" id="lockHint">Tahan HP diam sebentar</div>
  <div class="row" style="margin-top:12px;justify-content:center">
    <button class="btn" id="lockCancel">Batal</button>
    <button class="btn pri" id="lockNow">Simpan sekarang</button>
  </div>
</div></div>

<input type="file" id="filePhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fileLogo" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script src="db.js"></script>
<script src="map.js"></script>
<script src="sheet.js"></script>
<script src="app.js"></script>
</body>
</html>
